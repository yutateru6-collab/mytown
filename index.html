<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8F4" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="直方のこと、これ1個見ればだいたい分かる。生活から街の動きまで、やさしくつながる非公式の地域生活アプリMVP。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MYTOWN" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./review-fixes.css" />
  <title>MYTOWN 直方</title>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="go-home" aria-label="今日の直方へ">
        <span class="brand-mark" aria-hidden="true">の</span>
        <span>
          <strong>MYTOWN</strong>
          <small>直方・非公式MVP</small>
        </span>
      </button>
      <button class="icon-button" type="button" data-action="open-settings" aria-label="設定を開く">
        <span aria-hidden="true">⚙︎</span>
      </button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button type="button" data-tab="today" class="nav-item is-active" aria-current="page">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>きょう</span>
      </button>
      <button type="button" data-tab="nearby" class="nav-item">
        <span class="nav-icon" aria-hidden="true">⌖</span>
        <span>近く</span>
      </button>
      <button type="button" data-tab="discover" class="nav-item">
        <span class="nav-icon" aria-hidden="true">◎</span>
        <span>見つける</span>
      </button>
      <button type="button" data-tab="ask" class="nav-item">
        <span class="nav-icon" aria-hidden="true">✦</span>
        <span>聞く</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="./app.js" defer></script>
</body>
</html>
