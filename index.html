<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F4EA" />
  <meta name="description" content="直方市の公式公開情報を定期同期し、暮らしから市役所・市議会・予算まで前提知識ゼロでもたどれる非公式地域生活アプリMVP。" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./review-fixes.css" />
  <link rel="stylesheet" href="./politics.css?v=13" />
  <link rel="stylesheet" href="./election-history.css" />
  <link rel="stylesheet" href="./ui-v2.css?v=13" />
  <title>MYTOWN 直方</title>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="go-home" aria-label="今日の直方へ">
        <span class="brand-mark" aria-hidden="true">の</span>
        <span>
          <strong>MYTOWN</strong>
          <small>直方・非公式MVP</small>
        </span>
      </button>
      <button class="icon-button" type="button" data-action="open-settings" aria-label="設定を開く">
        <span aria-hidden="true">⚙︎</span>
      </button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button type="button" data-v2-nav="home" class="nav-item is-active" aria-current="page">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>きょう</span>
      </button>
      <button type="button" data-v2-nav="search" class="nav-item" aria-current="false">
        <span class="nav-icon" aria-hidden="true">⌕</span>
        <span>さがす</span>
      </button>
      <button type="button" data-v2-nav="action" class="nav-item is-center" aria-label="調べるメニューを開く">
        <span class="nav-icon" aria-hidden="true">＋</span>
        <span>調べる</span>
      </button>
      <button type="button" data-v2-nav="notifications" class="nav-item" aria-current="false">
        <span class="nav-icon" aria-hidden="true">🔔</span>
        <span>お知らせ</span>
      </button>
      <button type="button" data-v2-nav="menu" class="nav-item" aria-current="false">
        <span class="nav-icon" aria-hidden="true">☰</span>
        <span>メニュー</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=13" defer></script>
  <script src="./app-runtime.js" defer></script>
  <script src="./politics.js?v=13" defer></script>
  <script src="./election-history.js" defer></script>
  <script src="./ui-v2.js?v=13" defer></script>
