name: Recover validate and release P0 fixes

on:
  push:
    branches: [fix/p0-core-20260904]
    paths:
      - ".github/workflows/p0-apply-release-v3.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/fix/p0-core-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRANCH_NAME: fix/p0-core-20260904
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-core-20260904
          fetch-depth: 0

      - name: Recover and apply the P0 implementation recipe
        shell: bash
        run: |
          if [ ! -s p0-core.js ]; then
            recipe=""
            while read -r commit; do
              if git show "${commit}:.github/workflows/p0-implement.yml" >/tmp/p0-implement.yml 2>/dev/null; then
                recipe=/tmp/p0-implement.yml
                break
              fi
            done < <(git log --all --format=%H -- .github/workflows/p0-implement.yml)
            test -n "$recipe"
            python3 - <<'PY'
          from pathlib import Path
          workflow = Path('/tmp/p0-implement.yml').read_text(encoding='utf-8')
          opener = "          python3 - <<'PY'\n"
          closer = "\n          PY\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index(closer, start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          exec(compile(script, 'recovered-p0-recipe', 'exec'), {})
          PY
          fi

      - name: Clean release tree and commit the exact tested revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify_ux_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("('state.politics?.', 'politics search source'),", "('const politics = state.politics || {};', 'politics search source'),")
          path.write_text(text, encoding='utf-8')
          PY
          rm -f P0_IMPLEMENTATION_READY.md .p0-review-trigger
          rm -rf notes
          rm -f .github/workflows/p0-source-export.yml \
                .github/workflows/p0-implement.yml \
                .github/workflows/p0-release.yml \
                .github/workflows/p0-apply-release-v2.yml \
                .github/workflows/p0-apply-release-v3.yml
          git config user.name "mytown-p0-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No release-tree changes to commit.'
          else
            git commit -m "fix: implement approved P0 product improvements"
            git push origin HEAD:${BRANCH_NAME}
          fi

      - name: Verify static release contract
        shell: bash
        run: |
          test -s p0-core.js
          test -s p0-core.css
          grep -q '>近く</span>' index.html
          grep -q '>保存</span>' index.html
          ! grep -q '>市政</span>' index.html
          ! grep -q '>新着</span>' index.html
          grep -q 'map-nearby.js?v=4' index.html
          grep -q 'p0-core.js?v=1' index.html
          ! grep -q 'trimHomeLabels' index.html
          grep -q 'selected.slice(0, 2)' ui-home-v4.js
          grep -q 'grid-column: 1 / -1' p0-core.css
          node --check p0-core.js
          python3 scripts/verify_ux_contract.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source and data regression tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          for file in app.js app-runtime.js politics.js election-history.js ui-v2.js ui-home-v4.js map-nearby.js bulletin-reader.js civic-actions.js civic-portal.js p0-core.js sw.js; do node --check "$file"; done
          python scripts/verify_sources.py
          python scripts/test_data_pipeline.py
          python scripts/test_event_pipeline.py
          python scripts/test_event_quality.py
          python scripts/refine_event_quality.py --check
          python scripts/test_community_pipeline.py
          python scripts/verify_election_history.py
          for file in data/latest.json data/community-events.json data/community.json data/civic-portal.json data/politics.json; do python -m json.tool "$file" >/dev/null; done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mytown-http.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/mytown-http.log
          exit 1

      - name: Run responsive and civic-action browser suites
        env:
          VISUAL_QA_URL: http://127.0.0.1:4173/
          VISUAL_QA_DIR: p0-visual-qa
        run: |
          node scripts/capture_visual_qa.mjs
          node scripts/test_civic_actions_browser.mjs

      - name: Run targeted P0 browser checks
        shell: bash
        run: |
          cat > /tmp/p0.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, locale: 'ja-JP', timezoneId: 'Asia/Tokyo' });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto('http://127.0.0.1:4173/?release=3', { waitUntil: 'networkidle' });
            await page.locator('.v2-home-page').waitFor({ state: 'visible' });

            const navText = await page.locator('.bottom-nav').innerText();
            assert.match(navText, /近く/);
            assert.match(navText, /保存/);
            assert.doesNotMatch(navText, /市政|新着/);
            const homeText = await page.locator('.v2-home-page').innerText();
            ['今日、見ておくこと', '確認できた情報だけを表示しています。', '直方で、なにする？'].forEach(text => assert.ok(!homeText.includes(text), text));
            assert.ok(await page.locator('.v4-home-event-card').count() <= 2);

            const sourceKinds = await page.evaluate(() => {
              const items = combinedSearchItems();
              return {
                event: items.some(item => item.recordType === 'event'),
                community: items.some(item => ['activity', 'organization'].includes(item.recordType)),
                work: items.some(item => item.recordType === 'public-work'),
                person: items.some(item => item.recordType === 'person'),
              };
            });
            assert.equal(sourceKinds.event, true, JSON.stringify(sourceKinds));
            assert.equal(sourceKinds.community, true, JSON.stringify(sourceKinds));
            assert.equal(sourceKinds.work, true, JSON.stringify(sourceKinds));
            assert.equal(sourceKinds.person, true, JSON.stringify(sourceKinds));

            await page.locator('[data-v2-nav="nearby"]').click();
            await page.locator('.mytown-map-card').waitFor({ state: 'visible' });
            await page.locator('[data-v2-nav="home"]').click();
            await page.locator('[data-ca-open-saved].nav-item').click();
            await page.locator('#ca-dialog-title').waitFor({ state: 'visible' });
            assert.equal((await page.locator('#ca-dialog-title').innerText()).trim(), '保存したイベント');
            await page.locator('.ca-dialog-close').click();

            await page.locator('[data-v2-action="events"]').first().click();
            const card = page.locator('.v4-event-list-card').first();
            await card.waitFor({ state: 'visible' });
            const layout = await card.evaluate(element => {
              const actions = element.querySelector(':scope > .ca-event-actions');
              const c = element.getBoundingClientRect();
              const a = actions.getBoundingClientRect();
              return { cardWidth: c.width, actionWidth: a.width, actionHeight: a.height };
            });
            assert.ok(layout.actionWidth > layout.cardWidth * 0.75, JSON.stringify(layout));
            assert.ok(layout.actionHeight < 180, JSON.stringify(layout));

            await page.locator('[data-v2-nav="home"]').click();
            await page.locator('[data-v2-action="settings"]').first().click();
            const form = page.locator('#v2-preferences-form');
            const interest = form.locator('input[name="interests"]').first();
            await interest.check();
            const value = await interest.getAttribute('value');
            await form.locator('button[type="submit"]').click();
            await page.reload({ waitUntil: 'networkidle' });
            await page.locator('[data-v2-action="settings"]').first().click();
            assert.equal(await page.locator(`input[name="interests"][value="${value}"]`).isChecked(), true);

            await page.evaluate(() => {
              const date = new Date();
              date.setDate(date.getDate() - 1);
              const label = `${date.getMonth() + 1}/${date.getDate()} 10:00`;
              state.data.council = { ...(state.data.council || {}), nextDateLabel: label, __p0TemporalChecked: false };
              render();
            });
            const temporal = await page.evaluate(() => state.data.council.nextDateLabel);
            assert.equal(temporal, '次回日程を確認中');

            assert.deepEqual(pageErrors, []);
            await context.close();
          } finally {
            await browser.close();
          }
          EOF
          node /tmp/p0.mjs

      - name: Merge the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')"
          test -n "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "P0: repair core MYTOWN experience" \
            --body "Validated event layout, Nearby map, Saved access, temporal state, personalization, cross-source search, honest FAQ wording, accessibility targets and aligned QA/deployment configuration."
