name: MYTOWN QA

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "app-runtime.js"
      - "politics.js"
      - "election-history.js"
      - "ui-v2.js"
      - "ui-home-v4.js"
      - "map-nearby.js"
      - "bulletin-reader.js"
      - "civic-actions.js"
      - "civic-portal.js"
      - "p0-stability.js"
      - "reference-*.js"
      - "*.css"
      - "assets/**"
      - "sw.js"
      - "requirements.txt"
      - "data/*.json"
      - "scripts/**"
      - ".github/workflows/qa.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Sync Nogata official data", "Sync Nogata community events", "Sync Nogata community directory"]
    types: [completed]
  workflow_dispatch:

jobs:
  qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: JavaScript and Python syntax
        run: |
          node --check app.js
          node --check app-runtime.js
          node --check politics.js
          node --check election-history.js
          node --check ui-v2.js
          node --check ui-home-v4.js
          node --check map-nearby.js
          node --check bulletin-reader.js
          node --check civic-actions.js
          node --check civic-portal.js
          node --check p0-stability.js
          node scripts/test_garbage_ui.js
          node scripts/test_event_ui.js
          node scripts/test_community_ui.js
          node --check reference-top-1.js
          node --check reference-top-2.js
          node --check reference-top-3.js
          node --check reference-top-4.js
          node --check reference-ui.js
          node --check sw.js
          python -m py_compile scripts/sync_nogata.py
          python -m py_compile scripts/sync_nogata_v2.py
          python -m py_compile scripts/sync_meetings.py
          python -m py_compile scripts/sync_bulletin.py
          python -m py_compile scripts/sync_events.py
          python -m py_compile scripts/sync_community.py
          python -m py_compile scripts/pdf_tools.py
          python -m py_compile scripts/verify_sources.py
          python -m py_compile scripts/verify_high_risk.py
          python -m py_compile scripts/verify_ux_contract.py

      - name: JSON validity
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m json.tool data/changes.json > /dev/null
          python -m json.tool data/meetings.json > /dev/null
          python -m json.tool data/sources.json > /dev/null
          python -m json.tool data/politics.json > /dev/null
          python -m json.tool data/election-2023.json > /dev/null
          python -m json.tool data/bulletin.json > /dev/null
          python -m json.tool data/event-sources.json > /dev/null
          python -m json.tool data/community-events.json > /dev/null
          python -m json.tool data/community-sources.json > /dev/null
          python -m json.tool data/community.json > /dev/null
          python -m json.tool data/civic-report-routes.json > /dev/null
          python -m json.tool data/civic-portal.json > /dev/null

      - name: Official source registry
        run: python scripts/verify_sources.py

      - name: Civic pipeline regression tests
        run: |
          python scripts/test_data_pipeline.py
          python scripts/test_event_pipeline.py
          python scripts/test_community_pipeline.py

      - name: Historical election consistency
        run: python scripts/verify_election_history.py

      - name: Watercolor UI assets
        run: |
          test -s assets/hero/nogata-watercolor.webp
          test -s assets/mascot/machinavi.webp
          test -s assets/icons/nearby.webp
          test -s assets/icons/services.webp
          test -s assets/icons/deadline.webp
          test -s assets/icons/decision.webp
          test -s assets/illustrations/event-festival.svg
          test -s assets/illustrations/card-nearby.svg
          test -s assets/illustrations/card-deadline.svg
          test -s assets/illustrations/card-services.svg
          test -s assets/illustrations/card-decision.svg
          test -s assets/illustrations/card-bulletin.svg
          python scripts/verify_image_density.py
          grep -q 'cp -R assets _site/assets' .github/workflows/pages.yml

      - name: Citizen-first UX contract
        run: |
          python scripts/verify_ux_contract.py
          ! grep -q 'reference-ui' index.html
          ! grep -q '>提案する</span>' index.html
          ! grep -q 'MutationObserver' index.html
          grep -q '>近く</span>' index.html
          grep -q '>さがす</span>' index.html
          grep -q 'mytown-civic-v36-p0-stability' sw.js

      - name: Required citizen-first UX wiring
        run: |
          grep -q 'ui-v2.js' index.html
          grep -q 'ui-v2.css' index.html
          grep -q 'ui-home-v4.js' index.html
          grep -q 'ui-home-v4.css' index.html
          grep -q 'ui-home-v5.css' index.html
          grep -q 'map-nearby.js?v=3' index.html
          grep -q 'map-nearby.css?v=2' index.html
          grep -q 'p0-stability.js?v=1' index.html
          grep -q 'p0-stability.css?v=1' index.html
          grep -q 'bulletin-reader.js' index.html
          grep -q 'bulletin-reader.css' index.html
          grep -q 'civic-actions.js?v=2' index.html
          grep -q 'data-v2-action="bulletin"' bulletin-reader.js
          grep -q 'bulletin-reader-frame' bulletin-reader.js
          grep -q 'wholePdfUrl' bulletin-reader.js
          grep -q '直方のイベント' ui-home-v4.js
          grep -q '地域活動・ボランティアを探す' ui-home-v4.js
          grep -q 'data/community.json' app.js
          grep -q 'card-nearby.svg' ui-home-v5.css
          grep -q 'card-deadline.svg' ui-home-v5.css
          grep -q 'card-services.svg' ui-home-v5.css
          grep -q 'card-bulletin.svg' ui-home-v5.css
          grep -q 'data-v2-nav="home"' index.html
          grep -q 'data-v2-nav="nearby"' index.html
          grep -q 'data-v2-nav="search"' index.html
          grep -q 'data-v2-nav="notifications"' index.html
          grep -q 'data-v2-nav="menu"' index.html
          ! grep -q 'data-v2-nav="civic"' index.html
          grep -q 'politics.js' index.html
          grep -q 'politics.css' index.html
          grep -q 'civic-portal.js?v=4' index.html
          grep -q 'state.politicsSection = "people"' civic-portal.js
          grep -q 'ALLOWED_INTERESTS' p0-stability.js
          grep -q 'combinedSearchItemsAcrossMytown' p0-stability.js
          grep -q 'p0NormalizeCouncilState' p0-stability.js
          grep -q 'grid-column: 1 / -1' p0-stability.css
          grep -q '任期満了日' data/politics.json
          grep -q '政務活動費' data/politics.json
          grep -q '按分票' data/election-2023.json
