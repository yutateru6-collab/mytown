name: Sync Nogata official data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "requirements.txt"
      - "scripts/sync_nogata.py"
      - "scripts/sync_nogata_v2.py"
      - "scripts/sync_meetings.py"
      - "scripts/sync_bulletin.py"
      - "scripts/pdf_tools.py"
      - "scripts/verify_sources.py"
      - "scripts/verify_high_risk.py"
      - "scripts/verify_politics.py"
      - "scripts/test_data_pipeline.py"
      - "data/sources.json"
      - "data/politics.json"
      - "data/bulletin.json"
      - ".github/workflows/sync-nogata.yml"

permissions:
  contents: write

concurrency:
  group: sync-nogata-official-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate official source registry
        run: python scripts/verify_sources.py

      - name: Run offline pipeline regression tests
        run: python scripts/test_data_pipeline.py

      - name: Sync official council meetings
        run: python scripts/sync_meetings.py

      - name: Sync official data
        run: python scripts/sync_nogata_v2.py

      - name: Detect latest city bulletin
        run: python scripts/sync_bulletin.py

      - name: Double-check high-risk civic data
        run: python scripts/verify_high_risk.py

      - name: Verify mayor council election data
        run: python scripts/verify_politics.py

      - name: Validate JSON
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m json.tool data/meetings.json > /dev/null
          python -m json.tool data/sources.json > /dev/null
          python -m json.tool data/politics.json > /dev/null
          python -m json.tool data/bulletin.json > /dev/null

      - name: Commit changes safely
        run: |
          if git diff --quiet -- data/latest.json data/meetings.json data/politics.json data/bulletin.json; then
            echo "No data changes"
            exit 0
          fi

          # Never merge generated civic data across a moving main branch.
          # A newer code/config push will trigger a newer sync; otherwise the
          # next scheduled six-hour run will regenerate from official sources.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced during this sync; skipping stale generated-data commit"
            exit 0
          fi

          git config user.name "mytown-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/meetings.json data/politics.json data/bulletin.json
          git commit -m "data: sync Nogata official information"

          if ! git push origin HEAD:main; then
            echo "Main advanced before push; leaving data to the newer or next scheduled sync"
            exit 0
          fi
