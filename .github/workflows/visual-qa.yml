name: MYTOWN Visual QA

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "data/**"
      - "scripts/capture_visual_qa.mjs"
      - "scripts/test_civic_actions_browser.mjs"
      - "scripts/test_p0_browser.mjs"
      - "scripts/finalize_event_state.py"
      - ".github/workflows/visual-qa.yml"
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy MYTOWN to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refine source-preview event data
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          python3 scripts/refine_event_quality.py
          python3 scripts/finalize_event_state.py

      - name: Start source preview
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mytown-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mytown-http.log
          exit 1

      - name: Wait for the deployed civic revision
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          DEPLOYED_URL: https://yutateru6-collab.github.io/mytown/
        run: |
          for attempt in {1..40}; do
            cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            html="$(curl --fail --silent --show-error --retry 2 --retry-all-errors "${DEPLOYED_URL}?deployQa=${cache_bust}" || true)"
            civic="$(curl --fail --silent --show-error --retry 2 --retry-all-errors "${DEPLOYED_URL}civic-actions.js?v=2&deployQa=${cache_bust}" || true)"
            if grep -q 'civic-actions.js?v=2' <<<"${html}" && grep -q 'p0-stability.js?v=1' <<<"${html}" && grep -q 'このイベントも載せて' <<<"${civic}"; then
              echo "The deployed P0 revision is available."
              exit 0
            fi
            sleep 3
          done
          echo "GitHub Pages did not expose the tested P0 revision."
          exit 1

      - name: Capture source screenshots
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          VISUAL_QA_URL: http://127.0.0.1:4173/
          VISUAL_QA_DIR: visual-qa-output
        run: node scripts/capture_visual_qa.mjs

      - name: Capture deployed screenshots
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          VISUAL_QA_URL: https://yutateru6-collab.github.io/mytown/
          VISUAL_QA_DIR: visual-qa-output
        run: node scripts/capture_visual_qa.mjs

      - name: Test event and civic-reporting flows
        env:
          VISUAL_QA_URL: ${{ github.event_name == 'workflow_run' && 'https://yutateru6-collab.github.io/mytown/' || 'http://127.0.0.1:4173/' }}
          VISUAL_QA_DIR: visual-qa-output
        run: node scripts/test_civic_actions_browser.mjs

      - name: Test P0 navigation and layout regressions
        env:
          VISUAL_QA_URL: ${{ github.event_name == 'workflow_run' && 'https://yutateru6-collab.github.io/mytown/' || 'http://127.0.0.1:4173/' }}
          VISUAL_QA_DIR: visual-qa-output
        run: node scripts/test_p0_browser.mjs

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mytown-visual-qa-${{ github.run_id }}-${{ github.event_name }}
          path: visual-qa-output
          if-no-files-found: warn
          retention-days: 30
