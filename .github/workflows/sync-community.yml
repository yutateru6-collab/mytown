name: Sync Nogata community directory

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/community-sources.json"
      - "scripts/sync_community.py"
      - "scripts/test_community_pipeline.py"
      - ".github/workflows/sync-community.yml"

permissions:
  contents: write

concurrency:
  group: sync-nogata-community-directory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sources and parsers
        run: |
          python scripts/sync_community.py --check
          python scripts/test_community_pipeline.py

      - name: Sync community directory
        run: python scripts/sync_community.py

      - name: Validate generated data
        run: python -m json.tool data/community.json > /dev/null

      - name: Commit changes safely
        run: |
          if git diff --quiet -- data/community.json; then
            echo "No community directory changes"
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced during this sync; skipping stale generated-data commit"
            exit 0
          fi

          git config user.name "mytown-community-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community.json
          git commit -m "data: sync Nogata community directory"

          if ! git push origin HEAD:main; then
            echo "Main advanced before push; the next scheduled run will regenerate community data"
            exit 0
          fi
