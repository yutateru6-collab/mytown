name: P0 source export

on:
  push:
    branches: ["fix/p0-core-20260904"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: mytown-p0-source-${{ github.sha }}
          path: |
            index.html
            manifest.webmanifest
            sw.js
            *.js
            *.css
            data
            scripts
            .github/workflows
            requirements.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
