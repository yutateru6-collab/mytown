name: Apply MYTOWN P0 core

on:
  push:
    branches: ["fix/p0-core-20260904"]
    paths:
      - ".p0-patch.part-*"
      - ".github/workflows/p0-source-export.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mytown-p0-core
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-core-20260904
          fetch-depth: 0

      - name: Reassemble and verify reviewed patch
        run: |
          cat .p0-patch.part-* > /tmp/mytown-p0.patch.xz.b64
          base64 -d /tmp/mytown-p0.patch.xz.b64 | xz -d > /tmp/mytown-p0.patch
          echo "c5b87b18b78471ff7e845b30eedad36d2df519467886485946603d150618e657  /tmp/mytown-p0.patch" | sha256sum -c -
          git apply --check /tmp/mytown-p0.patch

      - name: Apply P0 fixes and run static checks
        run: |
          git apply /tmp/mytown-p0.patch
          node --check app.js
          node --check ui-v2.js
          node --check ui-home-v4.js
          node --check map-nearby.js
          node --check civic-actions.js
          node --check civic-portal.js
          node --check politics.js
          node --check scripts/test_civic_actions_browser.mjs
          python3 scripts/verify_ux_contract.py
          node scripts/test_event_ui.js
          node scripts/test_garbage_ui.js
          node scripts/test_community_ui.js
          node scripts/test_p0_core_ui.js
          git diff --check

      - name: Commit product files
        run: |
          git restore --source=HEAD -- .github/workflows/qa.yml .github/workflows/visual-qa.yml
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js civic-actions.css civic-actions.js civic-portal.css civic-portal.js index.html map-nearby.js politics.js scripts/test_civic_actions_browser.mjs scripts/test_event_ui.js scripts/test_p0_core_ui.js scripts/verify_ux_contract.py sw.js ui-home-v4.js ui-home-v5.css ui-v2.css ui-v2.js
          git commit -m "Fix P0 app usability and reliability"
          git push origin HEAD:fix/p0-core-20260904
