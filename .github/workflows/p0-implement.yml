from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]

def read(name: str) -> str:
    return (ROOT / name).read_text(encoding="utf-8")

def require(text: str, token: str, label: str) -> None:
    if token not in text:
        raise AssertionError(f"Missing {label}: {token}")

def forbid(text: str, token: str, label: str) -> None:
    if token in text:
        raise AssertionError(f"Forbidden {label}: {token}")

def main() -> None:
    index = read("index.html")
    ui = read("ui-v2.js")
    home = read("ui-home-v4.js")
    civic = read("civic-actions.js")
    portal = read("civic-portal.js")
    core = read("p0-core.js")
    core_css = read("p0-core.css")
    sw = read("sw.js")
    pages = read(".github/workflows/pages.yml")

    for token, label in (
        ('>近く</span>', 'nearby bottom navigation'),
        ('>保存</span>', 'saved-events bottom navigation'),
        ('aria-label="直方の情報をさがす"', 'search accessible name'),
        ('./map-nearby.css?v=3', 'map styles'),
        ('./map-nearby.js?v=4', 'map runtime'),
        ('./p0-core.css?v=1', 'P0 styles'),
        ('./p0-core.js?v=1', 'P0 runtime'),
        ('./civic-actions.js?v=2', 'aligned civic actions version'),
    ):
        require(index, token, label)

    for token in ('const trimHomeLabels', 'MutationObserver(trimHomeLabels)', '>市政</span>', '>新着</span>'):
        forbid(index, token, 'obsolete navigation/DOM workaround')

    require(ui, 'saved.interests.filter', 'persisted interests')
    require(ui, 'name="interests"', 'interest controls')
    require(ui, 'if (nav === "nearby")', 'nearby navigation handler')
    forbid(ui, 'interests: [] };', 'forced empty interests')
    forbid(ui, '<p class="v2-data-note">', 'removed hero disclaimer')

    require(home, 'selected.slice(0, 2)', 'two-event home preview')
    require(home, '最近の更新', 'non-today update label')
    forbid(home, '今日、見ておくこと', 'removed daily heading')
    forbid(home, '確認できた情報だけを表示しています。', 'removed redundant note')
    forbid(home, '直方で、なにする？', 'removed event heading')

    require(civic, 'data-ca-save-event-id', 'event save action')
    require(civic, 'data-ca-calendar-event-id', 'calendar action')
    require(core_css, 'grid-column: 1 / -1', 'event action grid repair')
    require(portal, '["politics", "works", "money"]', 'nearby hash released from civic portal')
    forbid(portal, '["politics", "works", "nearby", "money"]', 'civic takeover of nearby hash')

    for token, label in (
        ('combinedSearchItemsAcrossMytown', 'cross-source search'),
        ('state.data?.communityEvents?.events', 'community events search source'),
        ('state.civicPortal?.works', 'public works search source'),
        ('state.politics?.', 'politics search source'),
        ('p0NormalizeCouncilState', 'past-meeting guard'),
        ('関連する公開情報', 'honest FAQ fallback'),
        ('p0SaveInterests', 'interest save path'),
        ('p0-returning-visitor', 'returning visitor compact hero'),
    ):
        require(core, token, label)

    require(sw, 'mytown-civic-v28-p0-core', 'new service worker cache')
    for token in ('./map-nearby.js', './map-nearby.css', './p0-core.js', './p0-core.css'):
        require(sw, token, 'offline asset')
    require(pages, 'p0-core.js p0-core.css map-nearby.js map-nearby.css', 'deployed P0 assets')

    print('Approved P0 UX contract passed')

if __name__ == '__main__':
    main()
''')

