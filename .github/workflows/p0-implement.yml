name: Apply approved P0 product fixes

on:
  push:
    branches: [fix/p0-core-20260904]
    paths:
      - ".github/workflows/p0-implement.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/p0-core-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-core-20260904
          fetch-depth: 0

      - name: Apply P0 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # index.html: restore Nearby, expose Saved, load map/core, remove the
          # after-render DOM deletion workaround, and align asset versions.
          # ------------------------------------------------------------------
          path = 'index.html'
          text = read(path)
          if './map-nearby.css?v=3' not in text:
              text = text.replace('  <link rel="stylesheet" href="./civic-actions.css?v=1" />', '  <link rel="stylesheet" href="./map-nearby.css?v=3" />\n  <link rel="stylesheet" href="./civic-actions.css?v=2" />')
          else:
              text = text.replace('./civic-actions.css?v=1', './civic-actions.css?v=2')
          if './p0-core.css?v=1' not in text:
              text = text.replace('  <link rel="stylesheet" href="./civic-portal.css?v=2" />', '  <link rel="stylesheet" href="./civic-portal.css?v=2" />\n  <link rel="stylesheet" href="./p0-core.css?v=1" />')

          civic_nav = re.compile(r'\n\s*<button type="button" data-v2-nav="civic".*?</button>', re.S)
          nearby_nav = '''
      <button type="button" data-v2-nav="nearby" class="nav-item" aria-current="false">
        <span class="nav-icon" aria-hidden="true">⌖</span>
        <span>近く</span>
      </button>'''
          text, count = civic_nav.subn(nearby_nav, text, count=1)
          if count != 1 and 'data-v2-nav="nearby"' not in text:
              raise SystemExit('could not replace civic bottom nav')

          notification_nav = re.compile(r'\n\s*<button type="button" data-v2-nav="notifications".*?</button>', re.S)
          saved_nav = '''
      <button type="button" data-ca-open-saved class="nav-item" aria-label="保存したイベントを見る">
        <span class="nav-icon" aria-hidden="true">🔖</span>
        <span>保存</span>
      </button>'''
          text, count = notification_nav.subn(saved_nav, text, count=1)
          if count != 1 and 'data-ca-open-saved class="nav-item"' not in text:
              raise SystemExit('could not replace notifications bottom nav')

          versions = {
              './app.js?v=20': './app.js?v=21',
              './ui-v2.js?v=20': './ui-v2.js?v=21',
              './ui-home-v4.js?v=22': './ui-home-v4.js?v=23',
              './civic-actions.js?v=1': './civic-actions.js?v=2',
              './civic-portal.js?v=3': './civic-portal.js?v=4',
          }
          for old, new in versions.items():
              text = text.replace(old, new)

          if './map-nearby.js?v=4' not in text:
              text = text.replace('  <script src="./ui-home-v4.js?v=23" defer></script>', '  <script src="./ui-home-v4.js?v=23" defer></script>\n  <script src="./map-nearby.js?v=4" defer></script>')
          if './p0-core.js?v=1' not in text:
              text = text.replace('  <script src="./civic-portal.js?v=4" defer></script>', '  <script src="./civic-portal.js?v=4" defer></script>\n  <script src="./p0-core.js?v=1" defer></script>')

          text = re.sub(r'\n\s*<script>\s*\(\(\) => \{\s*const trimHomeLabels.*?</script>', '', text, flags=re.S)
          write(path, text)

          # ------------------------------------------------------------------
          # ui-v2.js: make preferences real, remove obsolete hero labels, add
          # honest interest settings and Nearby routing.
          # ------------------------------------------------------------------
          path = 'ui-v2.js'
          text = read(path)
          text = replace_required(
              text,
              '    return { ...V2_DEFAULT_PREFERENCES, ...saved, garbageArea, civicDigest, interests: [] };',
              '    const interests = Array.isArray(saved.interests) ? saved.interests.filter((item) => V2_INTERESTS.includes(item)) : [];\n    return { ...V2_DEFAULT_PREFERENCES, ...saved, garbageArea, civicDigest, interests };',
              'preference interest restoration',
          )

          hero_pattern = re.compile(r'function v2Hero\(\) \{.*?\n\}\n\nfunction v2SectionHeading', re.S)
          hero_replacement = '''function v2Hero() {
  const district = (state.v2Preferences?.district || "").trim();
  return `<section class="v2-hero${district ? " has-district" : ""}" aria-labelledby="v2-home-title">
    <div class="v2-hero-actions">
      <button type="button" class="v2-round-action" data-v2-action="settings" aria-label="地域と表示順の設定を開く"><span aria-hidden="true">⚙︎</span><small>設定</small></button>
    </div>
    <div class="v2-hero-copy"><p class="v2-date">${esc(v2DateLabel())}</p><p class="v2-wordmark">のおがた<span class="v2-wordmark-accent">日和</span></p><h1 id="v2-home-title">知れば直方は<br>もっとおもしろい！</h1>${district ? `<p class="v2-tagline">${esc(district)}</p>` : ""}</div>
    ${v2Mascot("チューリップと石炭をモチーフにした、のおがた日和の案内役まちナビ")}
  </section>`;
}

function v2SectionHeading'''
          text, count = hero_pattern.subn(hero_replacement, text, count=1)
          if count != 1:
              raise SystemExit('could not replace v2Hero')

          settings_pattern = re.compile(r'function v2SettingsView\(\) \{.*?\n\}\n\nsettingsView = v2SettingsView;', re.S)
          settings_replacement = '''function v2SettingsView() {
  const preferences = state.v2Preferences;
  const districtOptions = ["直方駅周辺", "感田", "植木", "頓野", "新入", "下境", "上境"];
  return `<section class="page v2-page v2-inner-page"><button class="back-button" type="button" data-action="back">‹ 戻る</button><div class="v2-inner-hero"><div><p class="eyebrow">設定</p><h1>自分に関係する情報を設定</h1><p>会員登録は不要です。設定は、このブラウザだけに保存されます。</p></div></div><form id="v2-preferences-form" class="v2-preferences-form"><fieldset><legend>ごみ収集エリア</legend><label class="v2-field"><span>お住まいの区域</span><select name="garbageArea"><option value="">選択してください</option><option value="east" ${preferences.garbageArea === "east" ? "selected" : ""}>市東部（月・木）</option><option value="west" ${preferences.garbageArea === "west" ? "selected" : ""}>市西部（火・金）</option></select><small>公式日程は、遠賀川・彦山川の東西で分かれています。自宅が川のどちら側かで選んでください。</small></label></fieldset><fieldset><legend>よく見る地域（任意）</legend><label class="v2-field"><span>町名・駅名・よく行く場所</span><input type="text" name="district" list="v2-district-options" value="${esc(preferences.district)}" placeholder="例：感田、直方駅周辺" maxlength="30"><datalist id="v2-district-options">${districtOptions.map((item) => `<option value="${esc(item)}"></option>`).join("")}</datalist><small>掲載情報に同じ地名があるとき、近い情報を優先します。位置情報は使いません。</small></label></fieldset><fieldset><legend>気になること</legend><div class="p0-interest-grid">${V2_INTERESTS.map((interest) => `<label><input type="checkbox" name="interests" value="${esc(interest)}" ${(preferences.interests || []).includes(interest) ? "checked" : ""}><span>${esc(interest)}</span></label>`).join("")}</div><small class="p0-field-note">選んだテーマは、ホーム・検索・イベントの並び順に使います。</small></fieldset><fieldset><legend>表示の設定</legend><label class="v2-check-row"><input type="checkbox" name="lifeNotifications" ${preferences.lifeNotifications ? "checked" : ""}><span><strong>暮らしの更新を先に表示</strong><small>オフにすると、市の動きを先に表示します。</small></span></label><label class="v2-field"><span>ホームに市の動きを表示</span><select name="civicDigest"><option value="weekly" ${preferences.civicDigest !== "off" ? "selected" : ""}>表示する</option><option value="off" ${preferences.civicDigest === "off" ? "selected" : ""}>表示しない</option></select><small>この設定はホームの表示だけを変えます。スマホへの通知ではありません。</small></label></fieldset><button class="primary-button v2-save-button" type="submit">設定を保存</button></form><div class="card info-card v2-about-card"><h2>このアプリについて</h2><p>のおがた日和は試験公開中の非公式アプリです。直方市の公式アプリではありません。市や地域団体などの公開情報を定期的に確認します。</p></div></section>`;
}

settingsView = v2SettingsView;'''
          text, count = settings_pattern.subn(settings_replacement, text, count=1)
          if count != 1:
              raise SystemExit('could not replace v2SettingsView')

          if 'if (nav === "nearby")' not in text:
              text = text.replace('function v2HandleNav(nav) {\n  if (nav === "home")', 'function v2HandleNav(nav) {\n  if (nav === "nearby") return v2SetRoute({ tab: "nearby", page: null, hash: "#nearby" });\n  if (nav === "home")', 1)
          text = text.replace('["home", "civic", "search", "notifications", "menu"]', '["home", "nearby", "civic", "search", "notifications", "menu"]')
          text = text.replace('直方のことを聞く', 'よくある質問から探す')
          text = text.replace('市の資料から答えを探す', '公開情報から探す')
          write(path, text)

          # ------------------------------------------------------------------
          # ui-home-v4.js: remove deleted headings at source, show two events,
          # prefer selected interests, and do not label old data as today's.
          # ------------------------------------------------------------------
          path = 'ui-home-v4.js'
          text = read(path)
          text = text.replace('kicker: hasPriorVisit ? "前回見たあと" : "今日の新着",', 'kicker: hasPriorVisit ? "前回見たあと" : (todaysLatest.length ? "今日の新着" : "最近の更新"),')
          text = text.replace('市・地域団体・施設の情報を、近い日から3件。', '市・地域団体・施設の情報を、近い日から2件。')
          text = text.replace('return selected.slice(0, 3).sort', 'return selected.slice(0, 2).sort')
          text = text.replace('if (selected.length < 3 && !usedSources.has', 'if (selected.length < 2 && !usedSources.has')
          text = text.replace('if (selected.length < 3) add(item);', 'if (selected.length < 2) add(item);')
          if 'v2MatchesPreferences(item)) score += 80' not in text:
              text = text.replace('    let score = 0;\n', '    let score = 0;\n    if (typeof v2MatchesPreferences === "function" && v2MatchesPreferences(item)) score += 80;\n', 1)

          text = text.replace('<section class="v4-daily-briefing" aria-labelledby="v4-daily-title"><div class="v4-daily-heading"><div><p>自分に関係する情報から</p><h2 id="v4-daily-title">今日、見ておくこと</h2></div></div><div class="v4-daily-error"', '<section class="v4-daily-briefing" aria-label="今日の生活情報"><div class="v4-daily-error"')
          text = text.replace('return `<section class="v4-daily-briefing" aria-labelledby="v4-daily-title">\n      <div class="v4-daily-heading"><h2 id="v4-daily-title">今日、見ておくこと</h2><span>${items.length}件</span></div>\n      <div class="v4-daily-list">${items.map(v4DailyBriefItem).join("")}</div>\n      <p class="v4-daily-note">確認できた情報だけを表示しています。</p>\n    </section>`;', 'return `<section class="v4-daily-briefing" aria-label="今日の生活情報"><div class="v4-daily-list">${items.map(v4DailyBriefItem).join("")}</div></section>`;')
          text = text.replace('<section class="v4-event-feature" aria-labelledby="v4-event-feature-title">', '<section class="v4-event-feature" aria-label="直方のイベント">')
          text = text.replace('          <h2 id="v4-event-feature-title">直方で、なにする？</h2>\n', '')
          text = text.replace('直方のことを聞く', 'よくある質問から探す')
          write(path, text)

          # ------------------------------------------------------------------
          # civic portal: let #nearby belong to the real map, not public works.
          # ------------------------------------------------------------------
          path = 'civic-portal.js'
          text = read(path)
          text = text.replace('["politics", "works", "nearby", "money"]', '["politics", "works", "money"]')
          text = text.replace('hash === "works" || hash === "nearby" ? "works" : "home"', 'hash === "works" ? "works" : "home"')
          write(path, text)

          # ------------------------------------------------------------------
          # Product core: one final compatibility layer for temporal state,
          # cross-source search, honest FAQ search, preference saving and A11y.
          # ------------------------------------------------------------------
          write('p0-core.js', r'''/* MYTOWN P0 product core — approved audit fixes. */
"use strict";

(() => {
  const P0_STOP_WORDS = /(?:について|教えて|知りたい|ありますか|ある？|ですか|いつ|どこ|だれ|誰|なに|何|どう|なぜ|なんで|は|が|を|の|に|で|と|も|？|\?)/g;
  const P0_SYNONYMS = [
    [/ゴミ|ごみ|廃棄物|資源ごみ/g, "ごみ"],
    [/子供|子ども|こども/g, "こども"],
    [/助成|補助|給付|支援金/g, "支援"],
    [/道路|道|舗装|路面/g, "道路"],
    [/高齢者|シニア|介護/g, "高齢"],
    [/催し|イベント|講座|教室|体験会/g, "イベント"],
    [/公共交通|路線|コミュニティバス/g, "バス"],
    [/工事|工事中|道路工事/g, "工事"],
  ];

  function p0TokyoDateKey(value = new Date()) {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(value);
    const map = Object.fromEntries(parts.map((part) => [part.type, part.value]));
    return `${map.year}-${map.month}-${map.day}`;
  }

  function p0DayNumber(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ""));
    return match ? Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])) / 86400000 : null;
  }

  function p0MeetingDateKey(value = "") {
    const match = String(value).match(/(?:^|\s)(\d{1,2})[\/.月](\d{1,2})/);
    if (!match) return "";
    const today = p0TokyoDateKey();
    const [year, currentMonth] = today.split("-").map(Number);
    const month = Number(match[1]);
    const day = Number(match[2]);
    let candidateYear = year;
    if (month < currentMonth - 6) candidateYear += 1;
    return `${candidateYear}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }

  function p0NormalizeCouncilState() {
    const council = state.data?.council;
    if (!council || council.__p0TemporalChecked) return;
    const key = p0MeetingDateKey(council.nextDateLabel || "");
    const today = p0TokyoDateKey();
    if (key && p0DayNumber(key) < p0DayNumber(today)) {
      council.lastPublishedDateLabel = council.nextDateLabel;
      council.nextDateLabel = "次回日程を確認中";
      council.nextSummary = "公開済みの次回日程を確認しています。";
      council.status = "日程確認中";
    }
    council.__p0TemporalChecked = true;
  }

  const p0BaseNormalizeQuery = typeof normalizeQuery === "function" ? normalizeQuery : (value) => String(value || "").toLowerCase();
  normalizeQuery = function normalizeQueryWithSynonyms(value = "") {
    let normalized = p0BaseNormalizeQuery(String(value || "").normalize("NFKC"));
    P0_SYNONYMS.forEach(([pattern, replacement]) => { normalized = normalized.replace(pattern, replacement); });
    return normalized.replace(/\s+/g, " ").trim();
  };

  function p0SourceUrl(item = {}) {
    return item.sourceUrl || item.url || item.websiteUrl || item.profileUrl || item.detailUrl || "";
  }

  function p0Canonical(item, fallback = {}) {
    const title = item.title || item.name || item.label || fallback.title || "公開情報";
    return {
      ...item,
      id: item.id || fallback.id || `p0-${normalizeQuery(title).replace(/[^\p{L}\p{N}]+/gu, "-").slice(0, 80)}`,
      title,
      summary: item.summary || item.description || item.note || fallback.summary || "公開情報の掲載元を確認できます。",
      category: item.category || fallback.category || "その他",
      sourceUrl: p0SourceUrl(item) || fallback.sourceUrl || "",
      published: item.published || item.date || item.updatedAt || fallback.published || "",
      recordType: item.recordType || fallback.recordType || "information",
    };
  }

  const p0BaseCombinedSearchItems = typeof combinedSearchItems === "function" ? combinedSearchItems : () => [];
  combinedSearchItems = function combinedSearchItemsAcrossMytown() {
    const all = [...p0BaseCombinedSearchItems()];
    const events = state.data?.communityEvents?.events || [];
    events.forEach((item) => all.push(p0Canonical(item, { category: "観光・イベント", recordType: "event" })));

    const community = state.data?.community || {};
    (community.activities || []).forEach((item) => all.push(p0Canonical(item, { category: "地域活動", recordType: "activity" })));
    (community.organizations || []).forEach((item) => all.push(p0Canonical(item, { category: "地域団体", recordType: "organization" })));

    (state.civicPortal?.works || []).forEach((item) => all.push(p0Canonical(item, {
      category: "工事・道路",
      recordType: "public-work",
      sourceUrl: item.sourcePageUrl || item.sourcePdfUrl || "",
      summary: `${item.location || "場所確認中"}・予定工期 ${item.plannedPeriod || "確認中"}`,
    })));

    const budget = state.civicPortal?.budget;
    if (budget?.generalAccountLabel) {
      all.push(p0Canonical({
        id: `budget-${budget.fiscalYear || "current"}`,
        title: `${budget.fiscalYear || "今年度"}の当初予算` ,
        summary: `一般会計 ${budget.generalAccountLabel}。使い道を項目別に確認できます。`,
        sourceUrl: budget.sourcePageUrl || budget.sourcePdfUrl || "",
      }, { category: "税金・予算", recordType: "budget" }));
    }

    const politics = state.politics || {};
    if (politics.mayor?.name) {
      all.push(p0Canonical({
        id: "politics-mayor",
        title: `直方市長 ${politics.mayor.name}`,
        summary: politics.mayor.term ? `${politics.mayor.term}。公式資料で確認できた経歴を掲載しています。` : "市長の役割と公開情報を確認できます。",
        sourceUrl: politics.mayor.sources?.[0]?.url || "",
      }, { category: "市長・市議会", recordType: "person" }));
    }
    (politics.council?.members || []).forEach((member) => {
      const questions = (member.recentQuestions || []).map((item) => item.title || item).filter(Boolean).join("、");
      all.push(p0Canonical({
        id: `council-member-${member.name}`,
        title: `市議会議員 ${member.name}`,
        summary: [member.committee, questions].filter(Boolean).join("。") || "所属委員会などの公開情報を確認できます。",
        sourceUrl: politics.council?.membersSourceUrl || "",
      }, { category: "市長・市議会", recordType: "person" }));
    });
    (politics.glossary || []).forEach((item) => all.push(p0Canonical(item, { category: "議会ことば", recordType: "glossary" })));

    const seen = new Set();
    return all.filter((item) => {
      if (!item?.title) return false;
      const key = `${normalizeQuery(item.title)}|${p0SourceUrl(item)}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  };

  function p0QueryTerms(question) {
    const normalized = normalizeQuery(question).replace(P0_STOP_WORDS, " ");
    const terms = normalized.split(/[\s、。・/]+/).map((item) => item.trim()).filter((item) => item.length >= 2);
    if (terms.length) return [...new Set(terms)];
    return normalized ? [normalized] : [];
  }

  function p0RelatedItems(question) {
    const terms = p0QueryTerms(question);
    if (!terms.length) return [];
    return combinedSearchItems().map((item) => {
      const title = normalizeQuery(item.title || "");
      const body = normalizeQuery(`${item.summary || ""} ${item.category || ""} ${item.location || ""}`);
      let score = 0;
      terms.forEach((term) => {
        if (title.includes(term)) score += 8;
        if (body.includes(term)) score += 3;
      });
      if (typeof v2MatchesPreferences === "function" && v2MatchesPreferences(item)) score += 2;
      return { item, score };
    }).filter((entry) => entry.score > 0).sort((a, b) => b.score - a.score).slice(0, 3).map((entry) => entry.item);
  }

  const p0BaseAnswerFor = typeof answerFor === "function" ? answerFor : () => "";
  answerFor = function answerForWithCrossSourceSearch(question) {
    const known = p0BaseAnswerFor(question);
    if (known && !known.includes("確認できませんでした")) return known;
    const related = p0RelatedItems(question);
    if (!related.length) return known;
    const rows = related.map((item) => {
      const href = p0SourceUrl(item);
      return `<article class="p0-answer-result"><small>${esc(item.category || "公開情報")}</small><strong>${esc(item.title)}</strong><p>${esc(item.summary || "")}</p>${href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">掲載元で確認 <span aria-hidden="true">↗</span></a>` : ""}</article>`;
    }).join("");
    return `<div class="card answer-card" role="status"><span class="pill verified">関連する公開情報</span><h3>質問への答えを断定せず、近い情報を表示します</h3><p>内容と日付を確認してから、掲載元を開いてください。</p><div class="p0-answer-results">${rows}</div><p class="muted">入力した質問：${esc(question)}</p></div>`;
  };

  const p0BaseAskView = typeof askView === "function" ? askView : null;
  if (p0BaseAskView) {
    askView = function honestFaqView(answer = "") {
      return p0BaseAskView(answer)
        .replaceAll("市の資料から答えを探します", "よくある質問と公開情報から探します")
        .replaceAll("ふだんの言葉で聞く", "よくある質問から探す")
        .replaceAll("現在取り込んでいる市の資料から、答えを探します。", "入力した言葉に近い公開情報を探します。答えを断定できないときは、関連情報だけを表示します。")
        .replaceAll("答えを探す", "情報を探す");
    };
  }

  const p0BaseActiveNav = typeof v2ActiveNav === "function" ? v2ActiveNav : null;
  if (p0BaseActiveNav) {
    v2ActiveNav = function activeNavWithNearby() {
      if (state.view === "tab" && state.tab === "nearby") return "nearby";
      return p0BaseActiveNav();
    };
  }

  function p0SaveInterests(form) {
    const interests = [...form.querySelectorAll('input[name="interests"]:checked')]
      .map((input) => input.value)
      .filter((item) => typeof V2_INTERESTS === "undefined" || V2_INTERESTS.includes(item));
    state.v2Preferences = { ...state.v2Preferences, interests };
    try {
      const prior = JSON.parse(localStorage.getItem(V2_PREFERENCES_KEY) || "{}");
      localStorage.setItem(V2_PREFERENCES_KEY, JSON.stringify({ ...prior, ...state.v2Preferences, interests }));
    } catch (error) {
      console.warn("Interest preferences could not be saved", error);
    }
  }

  document.addEventListener("submit", (event) => {
    if (event.target?.id !== "v2-preferences-form") return;
    p0SaveInterests(event.target);
    window.setTimeout(() => {
      try {
        const prior = JSON.parse(localStorage.getItem(V2_PREFERENCES_KEY) || "{}");
        localStorage.setItem(V2_PREFERENCES_KEY, JSON.stringify({ ...prior, interests: state.v2Preferences.interests || [] }));
      } catch (_error) {}
    }, 0);
  }, true);

  function p0EnhanceRenderedPage() {
    document.body.classList.toggle("p0-returning-visitor", Boolean(state.priorVisitAt));
    const lifecycle = document.querySelector(".ca-lifecycle ol");
    if (lifecycle && !lifecycle.hasAttribute("tabindex")) {
      lifecycle.tabIndex = 0;
      lifecycle.setAttribute("aria-label", "イベントを見つけて参加後につなげる7つの手順。左右にスクロールできます");
    }
  }

  const p0BaseRender = render;
  render = function renderWithP0Core() {
    p0NormalizeCouncilState();
    const result = p0BaseRender();
    requestAnimationFrame(p0EnhanceRenderedPage);
    return result;
  };

  p0NormalizeCouncilState();
  render();
})();
''')

